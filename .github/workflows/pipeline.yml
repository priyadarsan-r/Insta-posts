name: 6-Hour Reel Automation

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  render-and-post:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: ⚙️ Install System Utilities (FFmpeg & ImageMagick)
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick ffmpeg fonts-liberation
          # Patch ImageMagick security policy to allow text rendering
          sudo sed -i 's/<policy domain="path" rights="none" pattern="@\*"\/>/<policy domain="path" rights="read|write" pattern="@\*"\/>/g' /etc/ImageMagick-6/policy.xml

      # --- CACHING BLOCK ---
      - name: 💾 Cache Python Virtual Environment
        id: cache-venv
        uses: actions/cache@v4
        with:
          path: venv
          # This key changes anytime you edit main.py, forcing a fresh install
          key: ${{ runner.os }}-venv-${{ hashFiles('main.py') }}

      - name: 💾 Cache Playwright Chromium
        id: cache-playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('main.py') }}
      # ---------------------

      - name: 📦 Install Python Dependencies (Only on cache miss)
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: |
          python -m venv venv
          source venv/bin/activate
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 google-genai gTTS setuptools-rust openai-whisper playwright "moviepy<2.0.0"

      - name: 🌐 Install Playwright Browser Binary (Only on cache miss)
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: |
          source venv/bin/activate
          playwright install chromium

      - name: 🧩 Install OS Dependencies for Playwright (Runs every time)
        # GitHub spins up a fresh Ubuntu machine every run, so OS-level apt packages 
        # required by Chromium must be installed every time (but it takes < 5 seconds).
        run: |
          source venv/bin/activate
          playwright install-deps chromium

      - name: 🛡️ Route Traffic through Cloudflare WARP
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update && sudo apt-get install -y cloudflare-warp
          warp-cli --accept-tos registration new
          warp-cli --accept-tos connect
          sleep 5
          curl ifconfig.me

      - name: 🚀 Execute Python Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          # We must activate the cached virtual environment before running the script
          source venv/bin/activate
          python main.py

      - name: 📤 Upload Video Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instagram-reel
          path: final_reel.mp4
          retention-days: 5
