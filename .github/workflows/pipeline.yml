name: 6-Hour Reel Automation

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  render-and-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install System Utilities (FFmpeg & ImageMagick)
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick ffmpeg fonts-liberation
          # Patch ImageMagick security policy to allow text rendering
          sudo sed -i 's/<policy domain="path" rights="none" pattern="@\*"\/>/<policy domain="path" rights="read|write" pattern="@\*"\/>/g' /etc/ImageMagick-6/policy.xml

      - name: Install Python Dependencies & Browser
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 google-genai edge-tts playwright "moviepy<2.0.0"
          playwright install --with-deps chromium

      - name: Route Traffic through Cloudflare WARP (Bypass IP Block)
        run: |
          # Add Cloudflare's official repository
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          
          # Install and configure WARP
          sudo apt-get update && sudo apt-get install -y cloudflare-warp
          warp-cli --accept-tos registration new
          warp-cli --accept-tos connect
          
          # Wait 5 seconds for the tunnel to establish
          sleep 5
          
          # Print the new IP to the logs to confirm it changed
          curl ifconfig.me

      - name: Execute Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python main.py
